name: Bug Report
description: File a bug report for AgentForge
title: '[Bug]: '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: Thank you for reporting an issue with AgentForge!
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Run 'agentforge ...'
        2. Execute tool '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS version, Node version, pnpm version.
      placeholder: |
        - OS: Windows / macOS / Ubuntu
        - Node.js: v20.x
        - AgentForge: v0.1.0
    validations:
      required: true
